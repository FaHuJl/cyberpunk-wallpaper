<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyberpunk Night City</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:"Segoe UI",Arial,sans-serif}
  #bg-video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  .vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 38%,rgba(0,0,0,.38) 100%)}
  .scanlines{position:fixed;inset:0;pointer-events:none;opacity:.18;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
  .hud{position:fixed;top:3%;left:50%;transform:translateX(-50%);width:max-content;text-align:center;color:#6fffff;text-shadow:0 0 4px rgba(0,255,255,.85),0 0 16px rgba(0,210,255,.75),0 0 32px rgba(0,130,255,.4)}
  .time{font-family:Consolas,"Courier New",monospace;font-weight:700;font-size:clamp(38px,4vw,86px);line-height:1;letter-spacing:.08em}
  .weekday{margin-top:8px;font:600 clamp(16px,1.5vw,30px)/1 Consolas,"Courier New",monospace;letter-spacing:.22em}
  .date{margin-top:9px;font:500 clamp(14px,1.25vw,25px)/1 Consolas,"Courier New",monospace;letter-spacing:.12em}
  .ym-widget{position:fixed;left:4%;bottom:6%;display:flex;align-items:center;gap:13px;min-width:330px;max-width:min(480px,70vw);padding:13px 16px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(15,16,20,.82);box-shadow:0 18px 55px rgba(0,0,0,.55);backdrop-filter:blur(14px);color:#fff}
  .ym-cover{width:62px;height:62px;flex:0 0 62px;border-radius:10px;background:linear-gradient(135deg,#ffca18,#f02d68 54%,#7424cc);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
  .ym-main{min-width:0;flex:1}.ym-label{font-size:10px;line-height:1;text-transform:uppercase;letter-spacing:.12em;color:#ffcf23;margin-bottom:7px}.ym-title,.ym-artist{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ym-title{font-weight:700;font-size:15px}.ym-artist{margin-top:3px;color:rgba(255,255,255,.65);font-size:13px}.ym-progress{height:3px;margin-top:10px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}.ym-progress>i{display:block;width:28%;height:100%;border-radius:99px;background:#ffcc00}.ym-note{font-size:10px;line-height:1.2;color:rgba(255,255,255,.45);text-align:right}
  @media(max-width:700px){.ym-widget{left:50%;transform:translateX(-50%);bottom:4%;min-width:280px}.hud{top:2%}}
</style>
</head>
<body>
  <!-- Видео должно лежать в одной папке с index.html -->
  <video id="bg-video" autoplay muted loop playsinline>
    <source src="cyberpunk-night-city.1920x1080.mp4" type="video/mp4">
  </video>
  <div class="vignette"></div><div class="scanlines"></div>

  <section class="hud" aria-label="Текущие дата и время">
    <div class="time" id="time">00:00:00</div>
    <div class="weekday" id="weekday">ПОНЕДЕЛЬНИК</div>
    <div class="date" id="date">26 АВГУСТА 2026</div>
  </section>

  <!-- Визуальный виджет. HTML-обои не могут сами прочитать трек из отдельного приложения Яндекс Музыки. -->
  <section class="ym-widget" aria-label="Яндекс Музыка">
    <div class="ym-cover" aria-hidden="true"></div>
    <div class="ym-main">
      <div class="ym-label">Яндекс Музыка</div>
      <div class="ym-title" id="track-title">Трек не выбран</div>
      <div class="ym-artist" id="track-artist">Открой настройки обоев</div>
      <div class="ym-progress"><i id="track-progress"></i></div>
    </div>
    <div class="ym-note">NOW<br>PLAYING</div>
  </section>

<script>
  const weekdays=["ВОСКРЕСЕНЬЕ","ПОНЕДЕЛЬНИК","ВТОРНИК","СРЕДА","ЧЕТВЕРГ","ПЯТНИЦА","СУББОТА"];
  const months=["ЯНВАРЯ","ФЕВРАЛЯ","МАРТА","АПРЕЛЯ","МАЯ","ИЮНЯ","ИЮЛЯ","АВГУСТА","СЕНТЯБРЯ","ОКТЯБРЯ","НОЯБРЯ","ДЕКАБРЯ"];
  function updateClock(){
    const n=new Date();
    document.getElementById('time').textContent=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}:${String(n.getSeconds()).padStart(2,'0')}`;
    document.getElementById('weekday').textContent=weekdays[n.getDay()];
    document.getElementById('date').textContent=`${n.getDate()} ${months[n.getMonth()]} ${n.getFullYear()}`;
  }
  updateClock();setInterval(updateClock,1000);
</script>
</body>
</html>
